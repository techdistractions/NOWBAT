; Optional configuration; AUDIT is the only operator command.
; Default roots are CDrive\TOOLS\WIN1, WIN2, WIN3.
; WAS and Windows must be below the SAME original DOSBox-X CDrive.
; AUDIT runs a disposable complete Windows copy and never modifies original WIN.INI.
[runner]
; dosbox = C:\DOSBox-X\dosbox-x.exe
; timeout = 180
; cycles = max
; desktop = visible  ; temporary native-debugging default, shows DOSBox-X window
; desktop = hidden   ; opt-in automated private-desktop run

[WIN101]
; windows_dir = C:\DOSBox-X\CDrive\TOOLS\WIN1
; dosbox_conf = C:\DOSBox-X\WIN1.CONF
; machine = svga_s3
; win = WIN.COM

[WIN200]
; windows_dir = C:\DOSBox-X\CDrive\TOOLS\WIN2
; dosbox_conf = C:\DOSBox-X\WIN2.CONF
; machine = svga_s3
; win = WIN.COM

[WIN300]
; windows_dir = C:\DOSBox-X\CDrive\TOOLS\WIN3
; dosbox_conf = C:\DOSBox-X\WIN3.CONF
; machine = svga_s3
; win = WIN.COM
; args = /r
