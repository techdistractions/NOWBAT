name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and host-side script tests
        run: |
          python HOST/AUDIT.PY SOURCE
          python TESTS/SELFTEST.PY
          python TESTS/AUTOHOST.PY
          python TESTS/STARTSHOT_HOST.PY
          python TESTS/LOCALCONFIG.PY
          python TESTS/DISPATCH_HOST.PY
          python TESTS/GUISYNC_HOST.PY
          python TESTS/GUISYNC_AUDIT_HOST.PY
          python TESTS/MOUSE_HOST.PY
          python TESTS/INPUTABI_HOST.PY
          python TESTS/INPUT_HOST.PY
          python TESTS/WINDOW_HOST.PY
          python TESTS/KEYBOARD_HOST.PY
          python TESTS/NECOMPACT_HOST.PY
          python TESTS/REGRESSION_HOST.PY
          python TESTS/SNAPMODES_HOST.PY
      - name: Confirm source packaging succeeds
        run: python HOST/RELEASE.PY --source-only
